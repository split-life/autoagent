[project]
name = "autoagent"
version = "0.1.0"
description = "Autonomous agent engineering"
requires-python = ">=3.12"
dependencies = [
    "openai-agents",
    "pandas",
    "openpyxl",
    "numpy",
    "harbor",
]

[tool.ruff.lint.per-file-ignores]
# Imports after the 'HARBOR ADAPTER — fixed harness' boundary are intentional;
# the harness needs the file's main flow to define functions before the adapter imports.
"agent-claude.py" = ["E402"]
